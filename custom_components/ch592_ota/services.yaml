flash:
  name: Flash firmware
  description: >-
    Upload a WCH backup-OTA image. Firmware 1.6.0+ can be woken from its normal
    advertising window after complete size/CRC32/SHA-256 validation; older firmware
    must enter OTA with button B or the three-day window first.
  fields:
    address:
      name: Bluetooth address
      description: Target device address. Optional when only one CH592 is configured.
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    firmware:
      name: Firmware file
      description: Path under the Home Assistant config directory. Defaults to the configured path.
      example: "www/firmware/ch592_ota.bin"
      selector:
        text:
    version:
      name: Expected version
      description: Version string to wait for after reboot. Read from the .json sidecar when omitted.
      example: "1.2.4"
      selector:
        text:
    chunk:
      name: Chunk size
      description: >-
        Data bytes per PROGRAM write. Must be a multiple of 16 between 16 and 64.
        Leave empty to auto-pick from the MTU, then fall back to 64/32/16.
      example: 32
      selector:
        number:
          min: 16
          max: 64
          step: 16
          mode: box
abort:
  name: Abort OTA
  description: Cancel a running OTA upload and disconnect from the device.
  fields:
    address:
      name: Bluetooth address
      description: Target device address. Optional when only one CH592 is configured.
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
set_gas:
  name: Calibrate gas reading
  description: >-
    Calibrate the HA offset from the mechanical meter reading. This legacy
    service name is kept for compatibility and does not write to the device.
  fields:
    address:
      name: Bluetooth address
      description: Target device address. Optional when only one CH592 is configured.
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    value:
      name: Gas reading
      description: The mechanical meter reading used for HA calibration, in m³.
      example: 3050.79
      selector:
        number:
          min: 0
          max: 99999.999
          step: 0.001
          mode: box
cancel_gas:
  name: Cancel pending gas write
  description: Drop an armed gas write so pressing B upgrades firmware again.
  fields:
    address:
      name: Bluetooth address
      description: Target device address. Optional when only one CH592 is configured.
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
set_threshold:
  name: Set pulse threshold
  description: >-
    Write the TCRT5000 pulse threshold into the device's DataFlash over the OTA
    channel (firmware 1.4.1+). Outside OTA mode the value is persisted until a
    manual button-B window or the automatic three-day OTA window writes it. A
    successful threshold write is followed by any pending firmware upgrade in
    the same OTA window; a failed write remains pending and blocks that upgrade.
  fields:
    address:
      name: Bluetooth address
      description: Target device address. Optional when only one CH592 is configured.
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    value:
      name: Threshold
      description: >-
        Detection margin required for one pulse. Lower is more sensitive but
        counts noise; higher misses pulses. Default 100.
      example: 100
      selector:
        number:
          min: 20
          max: 2000
          step: 10
          mode: box
cancel_threshold:
  name: Cancel pending threshold write
  description: Drop an armed threshold write so pressing B upgrades firmware again.
  fields:
    address:
      name: Bluetooth address
      description: Target device address. Optional when only one CH592 is configured.
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:

