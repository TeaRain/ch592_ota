# 燃气表 + OTA 一张卡片（复制到仪表板 → 编辑 → 添加卡片 → 手动/YAML）
#
# 实体 ID 按这台设备当前注册的实际 ID 写；换设备/改过名字时请按
# 设置 → 设备与服务 → 该设备 页面里的 ID 调整。
# 新加的 number / button 实体 ID 跟随设备名，例如 number.<device>_gas_target。

type: vertical-stack
cards:
  - type: tile
    entity: update.ch592_firmware
    name: 固件
    icon: mdi:chip
    tap_action:
      action: perform-action
      perform_action: update.install
      target:
        entity_id: update.ch592_firmware
      confirmation:
        text: 确认升级固件？请先长按 B 键 3 秒让设备进入 OTA 模式。

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: sensor.sheng_huo_yang_tai_ch592_gas_total
        name: 燃气表读数
        icon: mdi:fire
      - type: tile
        entity: sensor.sheng_huo_yang_tai_bthome_sensor_bc6f_battery
        name: 电量
        icon: mdi:battery
      - type: tile
        entity: sensor.bthome_sensor_bc6f_signal_strength
        name: 信号
        icon: mdi:signal

  - type: entities
    title: 固件升级
    icon: mdi:update
    entities:
      - entity: sensor.sheng_huo_yang_tai_ch592_firmware_version
        name: 当前固件
      - entity: binary_sensor.ch592_ota_mode
        name: OTA 模式
      - entity: sensor.sheng_huo_yang_tai_ch592_ota_status
        name: 状态
      - entity: sensor.sheng_huo_yang_tai_ch592_ota_progress
        name: 进度
      - entity: button.ch592_check_for_updates
        name: 立即检查更新
      - entity: button.ch592_abort_ota
        name: 取消升级

  # HA 校准：提交机械表真实读数即更新 HA offset，不写设备、不需按 B、无需按钮。
  - type: entities
    title: HA 燃气读数校准
    icon: mdi:counter
    entities:
      - entity: sensor.sheng_huo_yang_tai_ch592_raw_gas_counter
        name: 设备原始计数
      - entity: number.sheng_huo_yang_tai_ch592_gas_target
        name: 机械表实际读数（输入后自动校准）

  # 采样阈值：默认 100，可设 20~2000。调低更灵敏（可能多计），调高更保守（可能漏计）。
  # 普通模式提交数值只登记待写入，仍须长按 B 3 秒；OTA 模式提交后才直接写入。
  - type: entities
    title: 采样阈值校正
    icon: mdi:tune-variant
    entities:
      - entity: sensor.sheng_huo_yang_tai_ch592_current_threshold
        name: 当前采样阈值（P/N按键调整）
      - entity: number.sheng_huo_yang_tai_ch592_pulse_threshold
        name: 采样阈值（待写入，按B生效）
      - entity: button.sheng_huo_yang_tai_ch592_cancel_pending_writes
        name: 取消待写入
