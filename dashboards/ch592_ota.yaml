# 燃气表 + OTA 一张卡片（复制到仪表板 → 编辑 → 添加卡片 → 手动/YAML）
#
# 实体 ID 按这台设备当前注册的实际 ID 写；换设备/改过名字时请按
# 设置 → 设备与服务 → 该设备 页面里的 ID 调整。
# 新加的 number / button 实体 ID 跟随设备名，例如 number.<device>_gas_target。

type: vertical-stack
cards:
  - type: tile
    entity: update.ch592_firmware
    name: 固件
    icon: mdi:chip
    tap_action:
      action: perform-action
      perform_action: update.install
      target:
        entity_id: update.ch592_firmware
      confirmation:
        text: 确认升级固件？请先长按 B 键 3 秒让设备进入 OTA 模式。

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: sensor.sheng_huo_yang_tai_bthome_sensor_bc6f_gas
        name: 燃气
        icon: mdi:fire
      - type: tile
        entity: sensor.sheng_huo_yang_tai_bthome_sensor_bc6f_battery
        name: 电量
        icon: mdi:battery
      - type: tile
        entity: sensor.bthome_sensor_bc6f_signal_strength
        name: 信号
        icon: mdi:signal

  - type: entities
    title: OTA
    icon: mdi:update
    entities:
      - entity: sensor.sheng_huo_yang_tai_ch592_firmware_version
        name: 当前固件
      - entity: binary_sensor.ch592_ota_mode
        name: OTA 模式
      - entity: sensor.sheng_huo_yang_tai_ch592_ota_status
        name: 状态
      - entity: sensor.sheng_huo_yang_tai_ch592_ota_progress
        name: 进度
      - entity: button.ch592_check_for_updates
        name: 立即检查更新
      - entity: button.ch592_abort_ota
        name: 取消升级

  # 燃气值校正：先在 number 里填目标值（只存草稿，不写设备），再点“写入燃气值”。
  # 设备不在 OTA 模式时点写入 → 记为待写入，长按 B 3 秒后写入（优先于自动升级）。
  - type: entities
    title: 燃气值校正
    icon: mdi:counter
    entities:
      - entity: sensor.sheng_huo_yang_tai_bthome_sensor_bc6f_gas
        name: 设备当前
      - entity: number.ch592_gas_target
        name: 写入为
      - entity: button.ch592_write_gas_value
        name: 写入燃气值
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ch592_write_gas_value
          confirmation:
            text: 确认把燃气值写为 Gas target 里的数值？这会改写设备 DataFlash 里的计费读数。
      - entity: button.ch592_cancel_pending_gas_write
        name: 取消待写入
