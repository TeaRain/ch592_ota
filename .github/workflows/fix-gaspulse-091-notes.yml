name: Fix GasPulse 0.9.1 release notes

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align release notes and record outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p .github/diagnostics
          log=.github/diagnostics/notes-result.log
          cat > /tmp/gaspulse-091-release-notes.md <<'EOF'
          GasPulse 0.9.1 新地址优先版。

          - GitHub 已原生改名为 `TeaRain/gaspulse-ha` 与 `TeaRain/gaspulse-firmware`，旧 GitHub 地址保留平台重定向。
          - 固件清单默认顺序：新 GitHub → 新 Gitee → 旧 Gitee → 旧 GitHub。
          - Gitee 仅作代码备份和固件 raw 回退，不作为 HACS 来源；HACS 自定义仓库只填写 GitHub。
          - `ch592_ota` domain、安装目录、服务、实体 ID、默认固件文件名和 BLE/OTA 协议保持不变。
          - BIN 下载候选复用同一份 manifest 的 version、size、CRC32 和 SHA-256，逐镜像独立校验，失败才安全回退。
          - 验证：`project_verify.py all` 16/16；HA 96、固件 23、workspace 35；HACS ZIP 23 成员，SHA-256 `9b4a7b1e4944829373032fbcedcd3d1dde23558f44b2a340031ec200ea0fb79e`。
          EOF
          {
            echo "== start $(date -u +%FT%TZ) =="
            echo "== gh release edit =="
            gh release edit v0.9.1 \
              --title 'GasPulse 蓝牙燃气表 0.9.1' \
              --notes-file /tmp/gaspulse-091-release-notes.md
            echo "edit_exit=$?"
            echo "== gh release view =="
            gh release view v0.9.1 --json tagName,name,isDraft,isPrerelease
            echo "== end =="
          } > "$log" 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log"
          git commit -m "ci: record 0.9.1 release notes result" -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push origin master
