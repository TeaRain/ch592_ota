name: Finalize GasPulse 0.9.1

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-gaspulse-091
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean temp artifacts, fix notes, retag to clean commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch .github/diagnostics
          git rm -f --ignore-unmatch \
            .github/workflows/diagnose-gaspulse-091.yml \
            .github/workflows/finalize-gaspulse-091.yml

          if ! git diff --cached --quiet; then
            git commit -m "ci: remove temporary 0.9.1 retag workflows and diagnostics" -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
            git push origin master
          fi
          clean_head=$(git rev-parse HEAD)
          echo "clean_head=$clean_head"

          cat > /tmp/gaspulse-091-release-notes.md <<'EOF'
GasPulse 0.9.1 新地址优先版。

- GitHub 已原生改名为 `TeaRain/gaspulse-ha` 与 `TeaRain/gaspulse-firmware`，旧 GitHub 地址保留平台重定向。
- 固件清单默认顺序：新 GitHub → 新 Gitee → 旧 Gitee → 旧 GitHub。
- Gitee 仅作代码备份和固件 raw 回退，不作为 HACS 来源；HACS 自定义仓库只填写 GitHub。
- `ch592_ota` domain、安装目录、服务、实体 ID、默认固件文件名和 BLE/OTA 协议保持不变。
- BIN 下载候选复用同一份 manifest 的 version、size、CRC32 和 SHA-256，逐镜像独立校验，失败才安全回退。
- 验证：`project_verify.py all` 16/16；HA 96、固件 23、workspace 35；HACS ZIP 23 成员，SHA-256 `9b4a7b1e4944829373032fbcedcd3d1dde23558f44b2a340031ec200ea0fb79e`。
EOF

          gh release edit v0.9.1 \
            --title 'GasPulse 蓝牙燃气表 0.9.1' \
            --notes-file /tmp/gaspulse-091-release-notes.md

          gh api -X PATCH "repos/TeaRain/gaspulse-ha/git/refs/tags/v0.9.1" \
            -f sha="$clean_head" -F force=true

          echo "== resulting tag =="
          gh api "repos/TeaRain/gaspulse-ha/git/ref/tags/v0.9.1"
          echo "== resulting release =="
          gh release view v0.9.1 --json tagName,name,isDraft,isPrerelease,targetCommitish
          echo "== workflows left =="
          ls -1 .github/workflows
