name: Sync release from Gitee

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the published Gitee repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitee.com/zigbridge/ch592_ota.git /tmp/ch592-upstream
          rsync -a --delete --exclude=.git --exclude=.github /tmp/ch592-upstream/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            version=$(jq -er '.version' custom_components/ch592_ota/manifest.json)
            git commit -m "release: CH592 OTA integration ${version}" -m "Co-Authored-By: Kimi Code <noreply@moonshot.cn>"
            git push origin master
          fi
      - name: Publish the integration release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' custom_components/ch592_ota/manifest.json)
          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target master --title "CH592 OTA ${version}" --generate-notes
          fi
