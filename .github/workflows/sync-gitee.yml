name: Sync release from Gitee

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror Gitee and publish 0.8.2
        run: |
          set -euo pipefail
          cloned=false
          for attempt in 1 2 3 4; do
            rm -rf /tmp/ch592-upstream
            if timeout 90 git clone --depth 1 https://gitee.com/zigbridge/ch592_ota.git /tmp/ch592-upstream; then
              cloned=true
              break
            fi
            sleep 10
          done
          "$cloned"
          rsync -a --delete --exclude=.git --exclude=.github /tmp/ch592-upstream/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            version=$(jq -er '.version' custom_components/ch592_ota/manifest.json)
            git commit -m "release: CH592 OTA integration ${version}" -m "Co-Authored-By: Kimi Code <noreply@anthropic.com>"
            if ! git push origin master; then
              git pull --rebase origin master
              git push origin master
            fi
          fi
      - name: Create the integration release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' custom_components/ch592_ota/manifest.json)
          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target master --title "CH592 OTA ${version}" --generate-notes
          fi
