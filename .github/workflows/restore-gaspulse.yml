name: Restore GasPulse from Gitee backup

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-gaspulse-ha
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified GasPulse 0.9.1 project files
        run: |
          set -euo pipefail
          rm -rf /tmp/gaspulse-ha
          git clone --depth 1 https://gitee.com/zigbridge/gaspulse-ha.git /tmp/gaspulse-ha
          rsync -a --delete --exclude=.git --exclude=.github /tmp/gaspulse-ha/ ./
          cp /tmp/gaspulse-ha/.github/workflows/release.yml .github/workflows/release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project file differences"
            exit 0
          fi
          git commit -m "restore: GasPulse 0.9.1 from verified Gitee backup" -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push origin master
