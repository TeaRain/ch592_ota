name: One-shot release 0.9.2

on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-092.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or correct the v0.9.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="30840d1c5c346c87c1b96a2b1e67d462079ac090"
          notes="$(mktemp)"
          cat > "$notes" <<'EOF'
          ## GasPulse 蓝牙燃气表 0.9.2

          维护版本，无功能与协议变化；HA domain `ch592_ota`、安装目录、服务、实体 ID、BLE/BTHome/OTA 协议均不变，设备固件仍为 1.6.2，无需重新烧录。

          ### 修复

          - 固件清单的 `size` 字段为非数字值时，下载流程现在以明确的 `HomeAssistantError` 在发出任何下载请求前失败，不再让裸 `ValueError` 穿出候选循环。fail-closed 行为不变：任何情况下都不会接受未通过 size/CRC32/SHA-256 校验的固件。

          ### 测试与工程

          - 新增 6 项回归：云端清单 coordinator 超时回退、坏 JSON 回退、全部地址失败的错误聚合、全候选哈希拒绝聚合、配置条目选项不被回写、畸形 `size` 拦截；HA 单测由 96 项增至 102 项。
          - 新增真实 HTTP 故障回退测试 `tests/real_http_fault_injection.py`：本机 loopback 真实 aiohttp 服务器驱动生产代码，覆盖清单 404/坏 JSON/缺字段、BIN 404/大小不符/CRC+SHA 不符/全候选损坏和 coordinator→下载全链路；无 aiohttp 时自动跳过，不影响默认零依赖门禁。
          - 发布工具 `publish_firmware.py`：`git commit` 失败时自动回滚本次白名单暂存，工作区保留，修正后可直接重跑。

          ### 发布物校验

          - HACS 归档 23 个成员，SHA-256：`24877b956214389e77b34ed831840fd9d1af9efada114daf79c620d42cbdb9d4`
          - 全量验证 16/16 通过（HA 102、固件 24、workspace 35）。

          升级方式：HACS 中打开集成页面，若未出现更新入口请用右上角菜单「更新信息（Update information）」强制刷新后再更新；更新后按 HA 提示重启。
          EOF
          if gh release view v0.9.2 >/dev/null 2>&1; then
            echo "release already exists; correcting title and notes"
            gh release edit v0.9.2 --title "GasPulse 蓝牙燃气表 0.9.2" --notes-file "$notes" --latest
          else
            gh release create v0.9.2 --target "$target" --title "GasPulse 蓝牙燃气表 0.9.2" --notes-file "$notes" --latest
          fi
          # Converge the tag on the clean release commit even if another workflow created it first.
          git fetch --tags --quiet
          current="$(git rev-parse "v0.9.2^{commit}" 2>/dev/null || echo "")"
          if [ "$current" != "$target" ]; then
            echo "moving tag v0.9.2 from $current to $target"
            git tag -f v0.9.2 "$target"
            git push --force origin v0.9.2
          fi
